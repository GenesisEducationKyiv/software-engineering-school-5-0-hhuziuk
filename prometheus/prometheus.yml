global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'weather-service'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['weather-service:3000']

  - job_name: 'email-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['email-service:4000']